<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal Numérico | Teoría / Apuntes</title>

    <!-- KaTEX para renderizado de fórmulas matemáticas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>

    <!-- Lector de Markdown para visor integrado -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>

    <!-- Sanitizador HTML para el visor de Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<canvas id="particle-canvas"></canvas>

<header>
    <div class="logo-title">Portal Numérico</div>
    <input type="text" class="search-box" id="buscador" placeholder="Buscar..." onkeyup="filtrarContenido()">
    <ul class="nav-links">
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="calculadora.html">Calculadora</a></li>
        <li><a href="apuntes.html" class="active-link">Apuntes</a></li>
        <li><a href="social.html">Conócenos</a></li>
    </ul>
</header>

<div class="main-container">

    <div class="container">
        <h1>Apuntes de Equipo</h1>
        <div class="subtitle">Subido y editado por colaboradores</div>

        <div class="apuntes-index-bar" id="indice-apuntes" style="display: none;">
            <span style="font-size: 0.75rem; color: var(--text-white); text-transform: uppercase; font-weight: bold; align-self: center;">Índice:</span>
        </div>

        <form id="form-apunte" class="form-apunte">
            <h4><i class="fa-solid fa-plus icon-left"></i>Agregar nuevo apunte</h4>
            <div class="form-group">
                <input type="text" name="titulo" placeholder="Título del tema (ej. Teorema de Bolzano)" maxlength="200" required>
            </div>
            <div class="form-group">
                <textarea name="contenido" rows="3" placeholder="Escribe la teoría o descripción (Opcional)..." maxlength="20000"></textarea>
            </div>
            <div class="form-group">
                <label>Adjuntar PDF o Markdown (Opcional)</label>
                <label for="archivo" class="file-upload-label">
                    <span id="file-name-display"><i class="fa-solid fa-file-arrow-up"></i> Haz clic para seleccionar un archivo...</span>
                </label>
                <input type="file" id="archivo" name="archivo" accept=".pdf,.md" style="display: none;">
            </div>
            <button type="submit" class="btn-outline" style="width: 100%;">Publicar Apunte</button>
        </form>

        <div id="lista-apuntes">
            <div id="apuntes-remotos"></div>
            <!-- Los apuntes se cargan dinámicamente desde Supabase (js/apuntes.js).
                 Se eliminaron los ejemplos hardcodeados para evitar duplicados y
                 mantener el índice generado por contenido real. -->
            <p id="apuntes-vacio" class="apuntes-vacio" style="display:none;">
                <i class="fa-regular fa-folder-open icon-left-sm"></i> Aún no hay apuntes publicados. ¡Sé el primero en compartir uno!
            </p>
            <p id="apuntes-sin-resultados" class="apuntes-vacio apuntes-vacio--busqueda" style="display:none;" role="status" aria-live="polite">
                <i class="fa-solid fa-magnifying-glass icon-left-sm"></i> No se encontraron apuntes para "<span id="termino-busqueda"></span>".
            </p>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/apuntes.js"></script>
<script src="../js/canvas-animation.js"></script>
</body>
</html>
