  <body>
    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <header>
      <div class="logo-title">Itera</div>
      <label class="visually-hidden" for="buscador">Buscar apuntes</label>
      <input
        type="text"
        class="search-box"
        id="buscador"
        placeholder="Buscar..."
        aria-label="Buscar apuntes"
        onkeyup="filtrarContenido()"
      />
      <ul class="nav-links">
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="calculadora.html">Calculadora</a></li>
        <li><a href="apuntes.html" class="active-link">Apuntes</a></li>
        <li><a href="social.html">Conócenos</a></li>
      </ul>
    </header>

    <div class="main-container">
      <div class="container">
        <h1>Apuntes de Equipo</h1>
        <div class="subtitle">Subido y editado por colaboradores</div>

        <form id="form-apunte" class="form-apunte">
          <h2 class="form-apunte-title"><i class="fa-solid fa-plus icon-left"></i>Agregar nuevo apunte</h2>
          <div class="form-group">
            <input
              type="text"
              name="titulo"
              placeholder="Título del tema (ej. Teorema de Bolzano)"
              maxlength="200"
              required
            />
          </div>
          <div class="form-group">
            <textarea
              name="contenido"
              rows="3"
              placeholder="Escribe la teoría o descripción (Opcional)..."
              maxlength="20000"
            ></textarea>
          </div>
          <div class="form-group">
            <label>Adjuntar PDF o Markdown (Opcional)</label>
            <label for="archivo" class="file-upload-label">
              <span id="file-name-display"
                ><i class="fa-solid fa-file-arrow-up"></i> Haz clic para seleccionar un
                archivo...</span
              >
            </label>
            <input
              type="file"
              id="archivo"
              name="archivo"
              accept=".pdf,.md"
              style="display: none"
            />
          </div>
          <button type="submit" class="btn-outline" style="width: 100%">Publicar Apunte</button>
        </form>

        <div id="lista-apuntes">
          <div id="apuntes-remotos"></div>
          <!-- Los apuntes se cargan dinámicamente desde Supabase (js/apuntes.js). -->
          <p id="apuntes-vacio" class="apuntes-vacio" style="display: none">
            <i class="fa-regular fa-folder-open icon-left-sm"></i> Aún no hay apuntes publicados.
            ¡Sé el primero en compartir uno!
          </p>
          <p
            id="apuntes-sin-resultados"
            class="apuntes-vacio apuntes-vacio--busqueda"
            style="display: none"
            role="status"
            aria-live="polite"
          >
            <i class="fa-solid fa-magnifying-glass icon-left-sm"></i> No se encontraron apuntes para
            "<span id="termino-busqueda"></span>".
          </p>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"
