<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal Numérico | Teoría / Apuntes</title>

    <!-- KaTEX para renderizado de fórmulas matemáticas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Lector de Markdown para visor integrado -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Sanitizador HTML para el visor de Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<canvas id="particle-canvas"></canvas>

<header>
    <div class="logo-title">Portal Numérico</div>
    <input type="text" class="search-box" id="buscador" placeholder="Buscar..." onkeyup="filtrarContenido()">
    <ul class="nav-links">
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="calculadora.html">Calculadora</a></li>
        <li><a href="apuntes.html" class="active-link">Apuntes</a></li>
        <li><a href="social.html">Conócenos</a></li>
    </ul>
</header>

<div class="main-container">

    <div class="container">
        <h1>Apuntes de Equipo</h1>
        <div class="subtitle">Subido y editado por colaboradores</div>

        <form id="form-apunte" class="form-apunte">
            <h4><i class="fa-solid fa-plus icon-left"></i>Agregar nuevo apunte</h4>
            <div class="form-group">
                <input type="text" name="titulo" placeholder="Título del tema (ej. Teorema de Bolzano)" required>
            </div>
            <div class="form-group">
                <textarea name="contenido" rows="3" placeholder="Escribe la teoría o descripción (Opcional)..."></textarea>
            </div>
            <div class="form-group">
                <label>Adjuntar PDF o Markdown (Opcional)</label>
                <label for="archivo" class="file-upload-label">
                    <span id="file-name-display"><i class="fa-solid fa-file-arrow-up"></i> Haz clic para seleccionar un archivo...</span>
                </label>
                <input type="file" id="archivo" name="archivo" accept=".pdf,.md" style="display: none;">
            </div>
            <button type="submit" class="btn-outline" style="width: 100%;">Publicar Apunte</button>
        </form>

        <div id="lista-apuntes">
            <div id="apuntes-remotos"></div>
            <!-- Los apuntes se cargan dinámicamente desde Supabase (js/apuntes.js).
                 Se eliminaron los ejemplos hardcodeados para evitar duplicados y
                 mantener el índice generado por contenido real. -->
            <p id="apuntes-vacio" class="apuntes-vacio" style="display:none;">
                <i class="fa-regular fa-folder-open icon-left-sm"></i> Aún no hay apuntes publicados. ¡Sé el primero en compartir uno!
            </p>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/apuntes.js"></script>
<script src="../js/canvas-animation.js"></script>
</body>
</html>
