<body>

<canvas id="particle-canvas" aria-hidden="true"></canvas>

    <header>
        <div class="logo-title">Itera</div>
        <ul class="nav-links">
            <li><a href="../index.html">Inicio</a></li>

            <li><a href="social.html">Conócenos</a></li>
        </ul>

<div class="main-container">

    <div class="container">
        <h1 id="titulo-metodo">Método de Bisección</h1>
        <div class="subtitle" id="subtitulo-metodo">Análisis de Procedimiento y Raíces</div>

        <form id="form-biseccion" onsubmit="ejecutarCalculo(event)">
            <div class="form-group" style="margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color);">
                <!-- v4 P1-2: sin style en línea; el color lo pone --method -->
                <label for="metodo-selector">Selecciona el Método Numérico</label>
                <select id="metodo-selector" onchange="alternarMetodoUI()">
                    <option value="biseccion">Método de Bisección</option>
                    <option value="puntofijo">Iteración de Punto Fijo</option>
                    <option value="newton">Método de Newton-Raphson</option>
                    <option value="taylor">Taylor y Maclaurin</option>
                    <option value="lagrangelineal">Interpolación Lineal de Lagrange</option>
                    <option value="lagrangepoly">Interpolación Polinomial de Lagrange</option>
                    <option value="simpson">Regla de Simpson 1/3</option>
                </select>
            </div>

            <div id="inputs-biseccion">
            <div class="form-group">
                <label for="funcion">Función f(x)</label>
                <input type="text" id="funcion" name="funcion" placeholder="Ej. x^3 - x - 2" maxlength="200" required>
                <div id="preview-fx" class="preview-fx"></div>
            </div>
            
            <!-- Menú matemático para Bisección (se construye en biseccion.js) -->
            <div id="menu-biseccion" class="examples-container math-menu" data-target="funcion"></div>

            <div class="form-row">
                <div class="form-group form-group--flex1">
                    <label for="a">Intervalo (a) - Deja en blanco para Auto (acepta pi, e)</label>
                    <input type="text" id="a" name="a" placeholder="Auto">
                </div>
                <div class="form-group form-group--flex1">
                    <label for="b">Intervalo (b) - Deja en blanco para Auto (acepta pi, e)</label>
                    <input type="text" id="b" name="b" placeholder="Auto">
                </div>
            </div>
            </div>

            <div id="inputs-puntofijo" style="display: none;">
                <div class="form-group">
                    <label for="funcion-gx">Función despejada g(x)</label>
                    <input type="text" id="funcion-gx" name="funcion-gx" placeholder="Ej. (2*x^2 - x + 3)^(1/3)" maxlength="200">
                    <div id="preview-gx" class="preview-fx"></div>
                </div>

                <!-- Menú matemático para Punto Fijo (se construye en biseccion.js) -->
                <div id="menu-puntofijo" class="examples-container math-menu" data-target="funcion-gx"></div>

                <div class="form-group">
                    <label for="x0">Valor Inicial (X₀)</label>
                    <input type="text" id="x0" name="x0" placeholder="Ej. 1 (acepta pi)">
                </div>
            </div>

            <div id="inputs-newton" style="display: none;">
                <div class="form-group">
                    <label for="funcion-newton">Función f(x)</label>
                    <input type="text" id="funcion-newton" name="funcion-newton" placeholder="Ej. x^3 - x - 1" maxlength="200" required>
                    <div id="preview-fx-newton" class="preview-fx"></div>
                </div>

                <div class="form-group">
                    <label>Derivada f'(x) — calculada automáticamente</label>
                    <div id="preview-fpx-newton" class="preview-fx" aria-live="polite"></div>
                </div>

                <!-- Menú matemático para Newton-Raphson (se construye en biseccion.js) -->
                <div id="menu-newton" class="examples-container math-menu" data-target="funcion-newton"></div>

                <div class="form-group">
                    <label for="x0-newton">Valor Inicial (X₀)</label>
                    <input type="text" id="x0-newton" name="x0-newton" placeholder="Ej. 1 (acepta pi)" required>
                </div>
            </div>

            <!-- ================== Series de Taylor / Maclaurin ================== -->
            <div id="inputs-taylor" style="display: none;">
                <div class="form-group">
                    <label for="funcion-taylor">Función f(x)</label>
                    <input type="text" id="funcion-taylor" name="funcion-taylor" placeholder="Ej. exp(x)" maxlength="200">
                    <div id="preview-fx-taylor" class="preview-fx"></div>
                </div>

                <!-- Menú matemático para Taylor (se construye en biseccion.js) -->
                <div id="menu-taylor" class="examples-container math-menu" data-target="funcion-taylor"></div>

                <div class="form-row">
                    <div class="form-group form-group--flex1">
                        <label for="a-taylor">Centro a (expansión alrededor de)</label>
                        <input type="text" id="a-taylor" name="a-taylor" placeholder="Ej. 0 (Maclaurin)">
                    </div>
                    <div class="form-group form-group--flex1">
                        <label for="x-taylor">Punto x a evaluar</label>
                        <input type="text" id="x-taylor" name="x-taylor" placeholder="Ej. 1 (acepta pi/6)">
                    </div>
                </div>

                <div class="form-group">
                    <label for="n-taylor">Grado del polinomio n</label>
                    <input type="number" step="1" min="1" max="20" id="n-taylor" name="n-taylor" placeholder="Ej. 5">
                </div>
            </div>

            <!-- ============== Interpolación Lineal de Lagrange ============== -->
            <div id="inputs-lagrangelineal" style="display: none;">
                <div class="form-row">
                    <div class="form-group form-group--flex1">
                        <label for="x0-lineal">x₀</label>
                        <input type="text" id="x0-lineal" name="x0-lineal" placeholder="Ej. 1">
                    </div>
                    <div class="form-group form-group--flex1">
                        <label for="y0-lineal">y₀ = f(x₀)</label>
                        <input type="text" id="y0-lineal" name="y0-lineal" placeholder="Ej. 2">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group form-group--flex1">
                        <label for="x1-lineal">x₁</label>
                        <input type="text" id="x1-lineal" name="x1-lineal" placeholder="Ej. 3">
                    </div>
                    <div class="form-group form-group--flex1">
                        <label for="y1-lineal">y₁ = f(x₁)</label>
                        <input type="text" id="y1-lineal" name="y1-lineal" placeholder="Ej. 6">
                    </div>
                </div>

                <div class="form-group">
                    <label for="x-lineal">Valor de x a interpolar</label>
                    <input type="text" id="x-lineal" name="x-lineal" placeholder="Ej. 2">
                </div>
            </div>

            <!-- ============ Interpolación Polinomial de Lagrange ============ -->
            <div id="inputs-lagrangepoly" style="display: none;">
                <div class="form-group">
                    <label for="x-poly">Valor de X a interpolar</label>
                    <input type="text" id="x-poly" name="x-poly" placeholder="Ej. 2.5 (acepta pi)">
                </div>

                <div class="form-group">
                    <label>Puntos conocidos (mínimo 3)</label>
                    <div id="tabla-puntos" class="tabla-puntos"></div>
                    <button type="button" id="btn-agregar-punto" class="btn-agregar-punto">
                        <i class="fa-solid fa-plus"></i> Agregar punto
                    </button>
                </div>
            </div>

            <!-- ================== Regla de Simpson 1/3 ================== -->
            <div id="inputs-simpson" style="display: none;">
                <div class="form-group">
                    <label for="funcion-simpson">Función f(x) a integrar</label>
                    <input type="text" id="funcion-simpson" name="funcion-simpson" placeholder="Ej. x^2" maxlength="200">
                    <div id="preview-fx-simpson" class="preview-fx"></div>
                </div>

                <!-- Menú matemático para Simpson (se construye en biseccion.js) -->
                <div id="menu-simpson" class="examples-container math-menu" data-target="funcion-simpson"></div>

                <div class="form-row">
                    <div class="form-group form-group--flex1">
                        <label for="a-simpson">Límite inferior (a)</label>
                        <input type="text" id="a-simpson" name="a-simpson" placeholder="Ej. 0 (acepta pi)">
                    </div>
                    <div class="form-group form-group--flex1">
                        <label for="b-simpson">Límite superior (b)</label>
                        <input type="text" id="b-simpson" name="b-simpson" placeholder="Ej. 2 o pi">
                    </div>
                </div>

                <div class="form-group">
                    <label for="n-simpson">Número de subintervalos n (par, ≥ 2)</label>
                    <input type="number" step="2" min="2" max="1000" id="n-simpson" name="n-simpson" placeholder="Ej. 4">
                </div>
            </div>

            <div class="form-group" id="grupo-criterio">
                <label for="criterio">Criterio de Paro</label>
                <select id="criterio" name="criterio" onchange="mostrarCampoCriterio(true)">
                    <option value="tolerancia">Tolerancia</option>
                    <option value="error">Porcentaje de Error Aproximado (Ea %)</option>
                    <option value="iteraciones">Número Exacto de Iteraciones</option>
                </select>
            </div>

            <div class="form-group" id="grupo-valor-criterio">
                <label id="label-criterio" for="valorCriterio">Valor de Tolerancia</label>
                <input type="text" id="valorCriterio" name="valorCriterio" placeholder="Ej. 0.001 o 1/16" maxlength="50" required>
            </div>

            <!-- Calcular (submit) + Graficar (gráfica independiente, sin ejecutar el método) -->
            <div class="form-actions">
                <button type="submit">Calcular Procedimiento</button>
                <button type="button" id="btn-graficar-libre" class="btn-graficar" style="display: none;">
                    Graficar
                </button>
            </div>
        </form>

        <div id="error-box" class="error-box" style="display: none;">
            <p id="error-text"></p>
        </div>

        <div id="info-box" class="info-box" style="display: none;">
            <p id="info-text"></p>
        </div>

        <div id="resultado-container" class="result-container" style="display: none;">
            <div class="result-divider"></div>
            <div id="resumen-container" class="resumen-container" style="display: none;"></div>

            <!-- Procedimiento en LaTeX (Taylor, Lagrange, Simpson) -->
            <div id="procedimiento-katex" class="procedimiento-katex" style="display: none;" aria-live="polite"></div>

            <!-- Bloque de tabla: se oculta con el divisor cuando aún no hay
                 resultados de un Calcular (p. ej. solo se pulsó Graficar) -->
            <div id="bloque-tabla">
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 25px 0 10px 0;">
                <h2 class="result-title" style="text-align: left; margin: 0;"><i class="fa-solid fa-table-list" style="margin-right: 6px;"></i>Tabla de Procedimiento</h2>
                <button type="button" id="btn-copy-icon" class="btn-icon-clipboard" onclick="copiarTablaClipboard()" title="Copiar tabla al portapapeles" style="display: none;">
                    <i class="fa-regular fa-clipboard"></i>
                </button>
            </div>
            <div class="table-scroll">
                <table class="procedure-table">
                    <thead id="tabla-cabecera">
                    <tr>
                        <th>Iter</th>
                        <th>a</th>
                        <th>b</th>
                        <th>x_m</th>
                        <th>f(x_m)</th>
                        <th>Ea (%)</th>
                    </tr>
                    </thead>
                    <tbody id="tabla-cuerpo">
                    </tbody>
                </table>
            </div>

            <div style="display: flex; justify-content: flex-end; margin-top: 14px;">
                <button type="button" id="btn-export-csv" class="btn-export" onclick="exportarTablaCSV()" style="display: none;">
                    <i class="fa-brands fa-file-excel"></i> Exportar a Excel (CSV)
                </button>
            </div>
            </div><!-- /bloque-tabla -->

            <div id="grafica-container" style="display: none; margin-top: 25px;">
                <h3 class="result-title" id="grafica-titulo" style="text-align: left; margin: 0 0 10px 0;"><i class="fa-solid fa-chart-line" style="margin-right: 6px;"></i><span>Gráfica de la función</span></h3>
                <canvas id="grafica" class="grafica-canvas" role="img" aria-label="Gráfica de la función calculada"></canvas>
                <p id="grafica-msg" class="apuntes-vacio" style="display: none;"></p>
            </div>
        </div>
    </div>

</div>

<footer class="site-footer">Itera · Portal Numérico — Métodos Numéricos</footer>

<script src="../js/graficadora.js" defer></script>
<script src="../js/taylor.js" defer></script>
<script src="../js/lagrange.js" defer></script>
<script src="../js/simpson.js" defer></script>
<script src="../js/canvas-animation.js" defer></script>
</body>
